<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>01 · Cover</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font: 400 14px/1.5 "Geist", -apple-system, "PingFang SC", sans-serif;
      color: var(--color-foreground);
      background: var(--color-default);
      display: grid; place-items: center; min-height: 100vh;
    }
    .canvas {
      width: 1080px; height: 1350px;
      background: var(--color-background);
      box-shadow: var(--shadow-overlay);
      padding: 80px;
      box-sizing: border-box;
      display: flex; flex-direction: column;
    }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .pg { font-size: 14px; color: var(--color-muted); letter-spacing: 1.5px; }
    .center { margin: auto 0; }
    .eyebrow {
      font-size: 24px; font-weight: 500; color: var(--color-muted);
      margin-bottom: 32px; letter-spacing: 0.5px;
    }
    .hero-num {
      font: 500 360px/0.9 "Geist", sans-serif;
      letter-spacing: -16px;
      color: var(--color-foreground);
      margin: 0;
    }
    .hero-line {
      font-size: 56px; font-weight: 500; line-height: 1.15;
      letter-spacing: -1px; margin-top: 32px;
      color: var(--color-foreground);
    }
    .hero-line .muted { color: var(--color-muted); }
    .footer { display: flex; justify-content: space-between; align-items: baseline; }
    .swipe { font-size: 18px; font-weight: 500; color: var(--color-muted); letter-spacing: 0.5px; }
    .wm { font-size: 14px; color: var(--color-muted); letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="badge badge--lg">Skill Doctor</span>
      <span class="pg">01 / 05</span>
    </div>
    <div class="center">
      <div class="eyebrow">My laptop currently has</div>
      <div class="hero-num">453</div>
      <div class="hero-line">AI agent skills, <span class="muted">across 8 runtimes.</span></div>
    </div>
    <div class="footer">
      <span class="swipe">Swipe →</span>
      <span class="wm">@30x · 30x-skill-doctor</span>
    </div>
  </div>
</body>
</html>
