<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>03 · 解决方案</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body { font: 400 14px/1.5 "Geist", -apple-system, "PingFang SC", sans-serif; color: var(--color-foreground); display: grid; place-items: center; min-height: 100vh; background: var(--color-default); }
    .canvas { width: 1080px; height: 1350px; background: linear-gradient(180deg, #FFF7E8 0%, #FFE6C7 100%); position: relative; overflow: hidden; padding: 80px 72px; box-sizing: border-box; box-shadow: var(--shadow-overlay); display: flex; flex-direction: column; }
    .blob { position: absolute; width: 500px; height: 500px; border-radius: 50%; filter: blur(60px); opacity: 0.4; pointer-events: none; }
    .blob-1 { top: -180px; left: -160px; background: var(--color-accent-soft); }
    .blob-2 { bottom: -160px; right: -160px; background: #FFD64A; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 56px; }
    .badge { padding: 12px 24px; background: rgba(255, 255, 255, 0.85); border-radius: 999px; font-size: 26px; font-weight: 500; }
    .page-num { font-size: 24px; font-weight: 500; color: var(--color-muted); letter-spacing: 1px; }
    .tag { display: inline-block; padding: 8px 22px; background: var(--color-foreground); color: var(--color-background); border-radius: 999px; font-size: 24px; font-weight: 500; margin-bottom: 24px; }
    .title { font-size: 96px; font-weight: 500; line-height: 1.05; letter-spacing: -2px; margin-bottom: 16px; }
    .title em { font-style: normal; background: linear-gradient(180deg, transparent 60%, #FFD64A 60%); padding: 0 8px; }
    .sub { font-size: 30px; color: var(--color-muted); margin-bottom: 50px; line-height: 1.4; max-width: 880px; }
    .dim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: auto; }
    .dim { padding: 28px 28px; background: rgba(255, 255, 255, 0.85); border-radius: 22px; backdrop-filter: blur(6px); display: flex; align-items: center; gap: 20px; }
    .dim-icon { font-size: 44px; line-height: 1; flex: none; }
    .dim-text strong { display: block; font-size: 30px; font-weight: 500; margin-bottom: 4px; }
    .dim-text span { font-size: 22px; color: var(--color-muted); line-height: 1.3; }
    .footer-row { display: flex; justify-content: flex-end; align-items: center; margin-top: 28px; }
    .watermark { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 500; color: var(--color-muted); opacity: 0.65; }
    .watermark-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-foreground); opacity: 0.5; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="top">
      <div class="badge">🩺 Skill Doctor</div>
      <div class="page-num">03 / 05</div>
    </div>
    <div>
      <span class="tag">✨ 一个命令</span>
      <div class="title">看清你的<br><em>整个 skill 仓库</em></div>
      <div class="sub">7 个维度全方位体检，跨 Claude / Codex / Cursor / OpenClaw 等 8 个 runtime 一次扫完</div>
    </div>
    <div class="dim-grid">
      <div class="dim"><div class="dim-icon">🟠</div><div class="dim-text"><strong>重复检测</strong><span>同名同内容的副本 一键合并</span></div></div>
      <div class="dim"><div class="dim-icon">🟡</div><div class="dim-text"><strong>漂移识别</strong><span>同名不同版本 让你选源</span></div></div>
      <div class="dim"><div class="dim-icon">✗</div><div class="dim-text"><strong>断链清理</strong><span>软链坏了 自动找出来</span></div></div>
      <div class="dim"><div class="dim-icon">🗑</div><div class="dim-text"><strong>垃圾扫除</strong><span>macOS 副本污染 通通清掉</span></div></div>
      <div class="dim"><div class="dim-icon">🕰</div><div class="dim-text"><strong>陈旧标记</strong><span>半年没动的 提醒你看一眼</span></div></div>
      <div class="dim"><div class="dim-icon">📋</div><div class="dim-text"><strong>写法质量</strong><span>SKILL.md 评分 + 修复建议</span></div></div>
    </div>
    <div class="footer-row"><span class="watermark"><span class="watermark-dot"></span>@30x · 30x-skill-doctor</span></div>
  </div>
</body>
</html>
