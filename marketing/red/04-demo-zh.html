<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>04 · Demo</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body { font: 400 14px/1.5 "Geist", -apple-system, "PingFang SC", sans-serif; color: var(--color-foreground); background: var(--color-default); display: grid; place-items: center; min-height: 100vh; }
    .canvas { width: 1080px; height: 1350px; background: var(--color-background); box-shadow: var(--shadow-overlay); padding: 80px; box-sizing: border-box; display: flex; flex-direction: column; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .pg { font-size: 14px; color: var(--color-muted); letter-spacing: 1.5px; }
    .eyebrow { font-size: 26px; font-weight: 500; color: var(--color-muted); margin-bottom: 12px; }
    .title { font: 500 96px/1 "Geist Mono", "SF Mono", Consolas, monospace; letter-spacing: -2px; margin: 0 0 32px 0; color: var(--color-foreground); }
    .title .accent { color: var(--color-accent); }
    .gif-frame { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--color-foreground); border-radius: var(--radius-3xl); box-shadow: var(--shadow-overlay); overflow: hidden; margin-bottom: 28px; }
    .gif-frame img { width: 100%; height: auto; max-height: 660px; object-fit: contain; border-radius: var(--radius-2xl); display: block; }
    .stats { display: flex; gap: 16px; }
    .stat-chip { flex: 1; min-width: 0; padding: 24px 28px; border-radius: var(--radius-2xl); gap: 6px; }
    .stat-chip .n { font: 500 56px/1 "Geist", sans-serif; letter-spacing: -2px; color: var(--color-foreground); }
    .stat-chip .lbl { font-size: 18px; color: var(--color-muted); }
    .footer { margin-top: auto; padding-top: 28px; display: flex; justify-content: space-between; align-items: baseline; }
    .takeaway { font-size: 24px; font-weight: 500; color: var(--color-foreground); }
    .takeaway .accent { color: var(--color-accent); }
    .wm { font-size: 14px; color: var(--color-muted); letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="badge badge--lg">Skill Doctor</span>
      <span class="pg">04 / 05</span>
    </div>

    <div class="eyebrow">实拍 · 我自己机器</div>
    <h1 class="title">$ <span class="accent">skill-doctor</span></h1>

    <div class="gif-frame">
      <img src="assets/demo.gif" alt="skill-doctor terminal demo" />
    </div>

    <div class="stats">
      <div class="card stat-chip">
        <span class="n">70</span>
        <span class="lbl">duplicate groups</span>
      </div>
      <div class="card stat-chip">
        <span class="n">38</span>
        <span class="lbl">drift conflicts</span>
      </div>
      <div class="card stat-chip">
        <span class="n">25</span>
        <span class="lbl">broken links</span>
      </div>
    </div>

    <div class="footer">
      <span class="takeaway"><span class="accent">40 秒</span> · 看完整个 453 个 skill</span>
      <span class="wm">@30x</span>
    </div>
  </div>
</body>
</html>
