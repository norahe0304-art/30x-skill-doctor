<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>04 · Demo</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font: 400 14px/1.5 "Geist", -apple-system, sans-serif;
      color: var(--color-foreground);
      background: var(--color-default);
      display: grid; place-items: center; min-height: 100vh;
    }
    .canvas {
      width: 1080px; height: 1350px;
      background: var(--color-background);
      box-shadow: var(--shadow-overlay);
      padding: 80px; box-sizing: border-box;
      display: flex; flex-direction: column;
    }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 56px; }
    .pg { font-size: 14px; color: var(--color-muted); letter-spacing: 1.5px; }
    .eyebrow { font-size: 22px; font-weight: 500; color: var(--color-muted); margin-bottom: 16px; letter-spacing: 0.5px; }
    .title { font-size: 80px; font-weight: 500; line-height: 1.05; letter-spacing: -2px; margin: 0 0 40px 0; }
    .gif-frame {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background: var(--color-foreground);
      border-radius: var(--radius-3xl);
      box-shadow: var(--shadow-overlay);
      overflow: hidden;
      margin-bottom: 32px;
    }
    .gif-frame img {
      width: 100%; height: auto;
      max-height: 720px;
      object-fit: contain;
      border-radius: var(--radius-2xl);
      display: block;
    }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat-chip {
      flex: 1; min-width: 0;
      padding: 24px 28px;
      border-radius: var(--radius-2xl);
      gap: 6px;
    }
    .stat-chip .n { font: 500 56px/1 "Geist", sans-serif; letter-spacing: -2px; }
    .stat-chip .lbl { font-size: 18px; color: var(--color-muted); }
    .footer { margin-top: auto; padding-top: 24px; display: flex; justify-content: space-between; align-items: baseline; }
    .takeaway { font-size: 24px; font-weight: 500; }
    .takeaway .accent { color: var(--color-accent); }
    .wm { font-size: 14px; color: var(--color-muted); letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="badge badge--lg">Skill Doctor</span>
      <span class="pg">04 / 05</span>
    </div>

    <div class="eyebrow">Real run, my own laptop</div>
    <h1 class="title">Watch it run.</h1>

    <div class="gif-frame">
      <img src="assets/demo.gif" alt="skill-doctor terminal demo" />
    </div>

    <div class="stats">
      <div class="card stat-chip">
        <span class="n">70</span>
        <span class="lbl">duplicate groups</span>
      </div>
      <div class="card stat-chip">
        <span class="n">38</span>
        <span class="lbl">drift conflicts</span>
      </div>
      <div class="card stat-chip">
        <span class="n">25</span>
        <span class="lbl">broken links</span>
      </div>
    </div>

    <div class="footer">
      <span class="takeaway"><span class="accent">40 seconds</span> · 453 skills mapped.</span>
      <span class="wm">@30x · 30x-skill-doctor</span>
    </div>
  </div>
</body>
</html>
