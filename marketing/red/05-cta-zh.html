<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>05 · CTA</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body { font: 400 14px/1.5 "Geist", -apple-system, "PingFang SC", sans-serif; color: var(--color-foreground); background: var(--color-default); display: grid; place-items: center; min-height: 100vh; }
    .canvas { width: 1080px; height: 1350px; background: var(--color-background); box-shadow: var(--shadow-overlay); padding: 80px; box-sizing: border-box; display: flex; flex-direction: column; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 80px; }
    .pg { font-size: 14px; color: var(--color-muted); letter-spacing: 1.5px; }
    .eyebrow { font-size: 26px; font-weight: 500; color: var(--color-muted); margin-bottom: 16px; }
    .title { font-size: 132px; font-weight: 500; line-height: 0.95; letter-spacing: -3px; margin: 0 0 32px 0; }
    .title .accent { color: var(--color-accent); }
    .lede { font-size: 28px; line-height: 1.5; color: var(--color-muted); max-width: 880px; margin-bottom: 48px; }
    .install { padding: 40px 48px; border-radius: var(--radius-3xl); background: var(--color-foreground); color: var(--color-background); font: 500 48px/1 "Geist Mono", "SF Mono", Consolas, monospace; box-shadow: var(--shadow-overlay); margin-bottom: 48px; }
    .install .pkg { color: var(--color-accent-soft-foreground); background: var(--color-accent-soft); padding: 4px 12px; border-radius: 8px; }
    .props { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { padding: 28px; border-radius: var(--radius-2xl); gap: 4px; }
    .card .h { font-size: 26px; font-weight: 500; color: var(--color-foreground); }
    .card .d { font-size: 20px; color: var(--color-muted); line-height: 1.5; }
    .footer { margin-top: auto; padding-top: 48px; display: flex; justify-content: space-between; align-items: baseline; }
    .footer .left { font-size: 22px; font-weight: 500; color: var(--color-foreground); }
    .footer .left .accent { color: var(--color-accent); }
    .wm { font-size: 14px; color: var(--color-muted); letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="badge badge--lg">Skill Doctor</span>
      <span class="pg">05 / 05</span>
    </div>

    <div class="eyebrow">如果你也装得快爆了</div>
    <h1 class="title">来<br><span class="accent">扫一遍</span></h1>
    <p class="lede">两个命令搞定。删之前先备份，永远是你点头才动手。一行 undo 完全回滚。</p>

    <div class="install">$ pip install <span class="pkg">skill-doctor</span></div>

    <div class="props">
      <div class="card">
        <span class="h">默认安全</span>
        <span class="d">每个动作先备份到 <code>~/.skill-doctor/backup/</code></span>
      </div>
      <div class="card">
        <span class="h">一键 undo</span>
        <span class="d"><code>skill-doctor undo</code> 撤销最近一次</span>
      </div>
      <div class="card">
        <span class="h">跨 8 runtime</span>
        <span class="d">Claude / Codex / Cursor / OpenClaw / 4 plugin 目录</span>
      </div>
      <div class="card">
        <span class="h">缓存极速</span>
        <span class="d">首次 40s · mtime 缓存后 0.4s</span>
      </div>
    </div>

    <div class="footer">
      <span class="left">完全开源 · MIT · 主页评论区领仓库 <span class="accent">↗</span></span>
      <span class="wm">@30x</span>
    </div>
  </div>
</body>
</html>
