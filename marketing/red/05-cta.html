<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>05 · 行动号召</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body { font: 400 14px/1.5 "Geist", -apple-system, "PingFang SC", sans-serif; color: var(--color-foreground); display: grid; place-items: center; min-height: 100vh; background: var(--color-default); }
    .canvas { width: 1080px; height: 1350px; background: linear-gradient(180deg, #FFF7E8 0%, #FFCB94 100%); position: relative; overflow: hidden; padding: 80px 72px; box-sizing: border-box; box-shadow: var(--shadow-overlay); display: flex; flex-direction: column; }
    .blob { position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; opacity: 0.5; }
    .blob-1 { top: -160px; right: -160px; width: 460px; height: 460px; background: #FFD64A; }
    .blob-2 { bottom: -180px; left: -180px; width: 500px; height: 500px; background: var(--color-accent-soft); }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
    .badge { padding: 12px 24px; background: rgba(255, 255, 255, 0.85); border-radius: 999px; font-size: 26px; font-weight: 500; backdrop-filter: blur(8px); }
    .page-num { font-size: 24px; font-weight: 500; color: var(--color-muted); letter-spacing: 1px; }
    .lead { font-size: 38px; color: var(--color-muted); margin-bottom: 16px; }
    .title { font-size: 140px; font-weight: 500; line-height: 0.95; letter-spacing: -4px; margin-bottom: 24px; }
    .title em { font-style: normal; background: linear-gradient(180deg, transparent 65%, #FFD64A 65%); }
    .sub { font-size: 32px; color: var(--color-muted); line-height: 1.4; max-width: 760px; }
    .install-card { margin-top: 56px; background: #1a1a1f; border-radius: 32px; padding: 48px 56px; box-shadow: 0 24px 48px rgba(0,0,0,0.22); }
    .install-label { color: #b8b8be; font-size: 24px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 18px; }
    .install-cmd { color: #f4f4f7; font: 500 56px/1.1 "Geist Mono", "SF Mono", Consolas, monospace; }
    .install-cmd .pkg { color: #fbbf24; }
    .features { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .feat { padding: 24px 28px; background: rgba(255, 255, 255, 0.78); border-radius: 20px; backdrop-filter: blur(6px); }
    .feat-icon { font-size: 38px; margin-bottom: 8px; }
    .feat-title { font-size: 26px; font-weight: 500; margin-bottom: 4px; }
    .feat-body { font-size: 20px; color: var(--color-muted); line-height: 1.4; }
    .footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 32px; }
    .gh { font-size: 26px; font-weight: 500; display: inline-flex; align-items: center; gap: 12px; }
    .gh svg { width: 30px; height: 30px; }
    .star-pill { font-size: 24px; font-weight: 500; padding: 12px 22px; background: rgba(255, 255, 255, 0.85); border-radius: 999px; }
    .watermark { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 500; color: var(--color-muted); opacity: 0.65; margin-top: 16px; align-self: flex-end; }
    .watermark-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-foreground); opacity: 0.5; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="top">
      <div class="badge">🩺 Skill Doctor</div>
      <div class="page-num">05 / 05</div>
    </div>
    <div>
      <div class="lead">想给自己的 AI skill 仓库</div>
      <div class="title">大<em>扫除</em>?</div>
      <div class="sub">两个命令搞定。删之前先备份，永远是你点头才动手，后悔了一行 undo。</div>
    </div>
    <div class="install-card">
      <div class="install-label">一行装</div>
      <div class="install-cmd">pip install <span class="pkg">skill-doctor</span></div>
    </div>
    <div class="features">
      <div class="feat"><div class="feat-icon">🔍</div><div class="feat-title">7 个维度</div><div class="feat-body">一次看清整个仓库</div></div>
      <div class="feat"><div class="feat-icon">🛡️</div><div class="feat-title">默认安全</div><div class="feat-body">y/N 点头 · 备份 · undo</div></div>
      <div class="feat"><div class="feat-icon">🔗</div><div class="feat-title">跨 8 runtime</div><div class="feat-body">Claude · Codex · Cursor...</div></div>
      <div class="feat"><div class="feat-icon">⚡</div><div class="feat-title">缓存极速</div><div class="feat-body">首次 40s · 之后 0.4s</div></div>
    </div>
    <div class="footer">
      <span class="gh">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        norahe0304-art / 30x-skill-doctor
      </span>
      <span class="star-pill">⭐ 给个 star?</span>
    </div>
    <span class="watermark"><span class="watermark-dot"></span>@30x · 30x-skill-doctor</span>
  </div>
</body>
</html>
