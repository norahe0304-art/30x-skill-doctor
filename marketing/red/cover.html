<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Skill Doctor · 小红书封面</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font: 400 14px/1.5 "Geist", -apple-system, "PingFang SC", sans-serif;
      color: var(--color-foreground);
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: var(--color-default);
    }
    .canvas {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #FFF7E8 0%, #FFE6C7 60%, #FFD0A0 100%);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-overlay);
    }
    .blob-1 {
      position: absolute; top: -120px; right: -120px;
      width: 520px; height: 520px;
      background: var(--color-accent-soft);
      border-radius: 50%;
      filter: blur(40px);
      opacity: .7;
    }
    .blob-2 {
      position: absolute; bottom: -160px; left: -160px;
      width: 600px; height: 600px;
      background: color-mix(in srgb, var(--palette-amber-400) 60%, transparent);
      border-radius: 50%;
      filter: blur(50px);
      opacity: .6;
    }
    .top-row {
      position: absolute; top: 80px; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 80px;
    }
    .badge {
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      font-size: 26px; font-weight: 500;
      color: var(--color-foreground);
    }
    .swipe-hint {
      font-size: 28px;
      color: var(--color-muted);
      font-weight: 500;
    }
    .hero {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; width: 92%;
    }
    .label {
      font-size: 56px; font-weight: 500;
      color: var(--color-foreground);
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }
    .number {
      font-size: 460px;
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -16px;
      color: var(--color-foreground);
      background: linear-gradient(180deg, #1f1f23 0%, #d94132 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .number-suffix {
      font-size: 64px; font-weight: 500;
      color: var(--color-foreground);
      margin-top: 24px;
    }
    .punchline {
      margin-top: 60px;
      font-size: 92px; font-weight: 500;
      line-height: 1.15;
      color: var(--color-foreground);
      letter-spacing: -2px;
    }
    .punchline em {
      font-style: normal;
      background: linear-gradient(180deg, transparent 60%, #FFD64A 60%);
      padding: 0 8px;
    }
    .runtimes {
      position: absolute; bottom: 240px; left: 0; right: 0;
      text-align: center;
    }
    .runtimes-line {
      display: inline-flex; gap: 16px; flex-wrap: wrap;
      justify-content: center; padding: 0 80px;
    }
    .rt-chip {
      padding: 16px 32px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      font-size: 32px; font-weight: 500;
      color: var(--color-foreground);
      box-shadow: var(--shadow-surface);
    }
    .footer {
      position: absolute; bottom: 80px; left: 0; right: 0;
      text-align: center;
      font-size: 30px; font-weight: 500;
      color: var(--color-muted);
    }
    .footer strong {
      font-weight: 500;
      color: var(--color-foreground);
    }
    .watermark {
      position: absolute; bottom: 32px; right: 48px;
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 22px; font-weight: 500;
      color: var(--color-muted);
      opacity: 0.6;
      letter-spacing: 0.5px;
    }
    .watermark-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-foreground);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="top-row">
      <div class="badge">🩺 Skill Doctor</div>
      <div class="swipe-hint">滑动查看 →</div>
    </div>

    <div class="hero">
      <div class="label">我的电脑里有</div>
      <div class="number">453</div>
      <div class="number-suffix">个 AI agent skill</div>
      <div class="punchline">而我<em>根本不知道</em><br>哪些是重复的 😵‍💫</div>
    </div>

    <div class="runtimes">
      <div class="runtimes-line">
        <span class="rt-chip">Claude Code</span>
        <span class="rt-chip">Codex</span>
        <span class="rt-chip">Cursor</span>
        <span class="rt-chip">OpenClaw</span>
      </div>
      <div class="runtimes-line" style="margin-top: 20px;">
        <span class="rt-chip">Agents</span>
        <span class="rt-chip">OpenCode</span>
        <span class="rt-chip">+ 2 plugin marketplaces</span>
      </div>
    </div>

    <div class="footer">
      跨 8 个 runtime · <strong>一团乱麻</strong>
    </div>

    <div class="watermark">
      <span class="watermark-dot"></span>
      @30x · 30x-skill-doctor
    </div>
  </div>
</body>
</html>
