<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Skill Doctor · 解决方案</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font: 400 14px/1.5 "Geist", -apple-system, "PingFang SC", sans-serif;
      color: var(--color-foreground);
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: var(--color-default);
    }
    .canvas {
      width: 1080px;
      height: 1920px;
      background: linear-gradient(180deg, #FFEDD5 0%, #FFE0BA 100%);
      position: relative;
      overflow: hidden;
      padding: 80px;
      box-sizing: border-box;
      box-shadow: var(--shadow-overlay);
    }
    .header {
      text-align: left;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      font-size: 26px; font-weight: 500;
      color: var(--color-foreground);
      margin-bottom: 32px;
    }
    .title {
      font-size: 96px; font-weight: 500;
      line-height: 1.1; letter-spacing: -2px;
      color: var(--color-foreground);
      margin: 0;
    }
    .subtitle {
      margin-top: 32px;
      font-size: 36px; font-weight: 400;
      line-height: 1.4;
      color: var(--color-muted);
    }
    .terminal {
      margin-top: 60px;
      background: #1a1a1f;
      border-radius: 32px;
      padding: 48px;
      color: #e8e8ec;
      font: 500 28px/1.6 "Geist Mono", "SF Mono", Consolas, monospace;
      box-shadow: 0 24px 48px rgba(0,0,0,0.18);
    }
    .terminal-bar {
      display: flex; gap: 12px; margin-bottom: 28px;
    }
    .dot { width: 18px; height: 18px; border-radius: 50%; }
    .dot-r { background: #ff5f56; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #27c93f; }
    .term-prompt { color: #7dd3a4; }
    .term-cmd { color: #e8e8ec; }
    .term-summary {
      color: #fbbf24;
      margin-top: 16px;
      font-weight: 500;
    }
    .term-row {
      display: flex; justify-content: space-between;
      padding: 4px 0;
    }
    .term-row .label { color: #b8b8be; font-size: 26px; }
    .term-row .val { color: #f4f4f7; font-weight: 500; font-size: 26px; }

    .findings-grid {
      margin-top: 32px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .finding {
      padding: 20px 24px;
      border-radius: 16px;
      display: flex; align-items: center; gap: 16px;
      font-size: 28px;
    }
    .finding-icon { font-size: 36px; }
    .finding strong { font-weight: 500; }
    .finding-dup { background: rgba(220, 154, 43, 0.15); color: #b27c1f; }
    .finding-drift { background: rgba(240, 183, 71, 0.18); color: #8a5a13; }
    .finding-broken { background: rgba(217, 65, 50, 0.13); color: #c2322a; }
    .finding-junk { background: rgba(106, 106, 110, 0.12); color: #54545a; }

    .bottom-callout {
      position: absolute; bottom: 80px; left: 80px; right: 80px;
      padding: 36px 48px;
      background: var(--color-foreground);
      color: var(--color-background);
      border-radius: 28px;
      font-size: 38px; font-weight: 500;
      text-align: center;
      letter-spacing: -0.5px;
    }
    .bottom-callout em {
      font-style: normal;
      color: #FFD64A;
    }
    .watermark {
      position: absolute; bottom: 32px; right: 48px;
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 22px; font-weight: 500;
      color: var(--color-muted);
      opacity: 0.6;
      letter-spacing: 0.5px;
    }
    .watermark-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-foreground);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="header">
      <div class="badge">🩺 Skill Doctor</div>
      <h1 class="title">一个命令<br>看清整个仓库</h1>
      <div class="subtitle">扫描 + 诊断 + 给清理方案 · 不动你的文件除非你点头</div>
    </div>

    <div class="terminal">
      <div class="terminal-bar">
        <span class="dot dot-r"></span>
        <span class="dot dot-y"></span>
        <span class="dot dot-g"></span>
      </div>
      <div><span class="term-prompt">$</span> <span class="term-cmd">skill-doctor</span></div>
      <div style="margin-top: 24px;">
        <div class="term-summary">📂 你有 453 个 skill, 跨 8 个 runtime:</div>
        <div style="margin-top: 12px;">
          <div class="term-row"><span class="label">Claude Code</span><span class="val">154</span></div>
          <div class="term-row"><span class="label">OpenClaw</span><span class="val">151</span></div>
          <div class="term-row"><span class="label">Plugin (Claude)</span><span class="val">48</span></div>
          <div class="term-row"><span class="label">Agents</span><span class="val">44</span></div>
          <div class="term-row"><span class="label">Codex</span><span class="val">31</span></div>
        </div>
      </div>
    </div>

    <div class="findings-grid">
      <div class="finding finding-dup">
        <span class="finding-icon">🟠</span>
        <span><strong>70 组</strong>重复</span>
      </div>
      <div class="finding finding-drift">
        <span class="finding-icon">🟡</span>
        <span><strong>38 组</strong>漂移</span>
      </div>
      <div class="finding finding-broken">
        <span class="finding-icon">✗</span>
        <span><strong>25 个</strong>断链</span>
      </div>
      <div class="finding finding-junk">
        <span class="finding-icon">📋</span>
        <span><strong>F:18</strong> 评分太低</span>
      </div>
    </div>

    <div class="bottom-callout">
      40 秒 · <em>看清现状</em> · 给方案
    </div>

    <div class="watermark">
      <span class="watermark-dot"></span>
      @30x · 30x-skill-doctor
    </div>
  </div>
</body>
</html>
