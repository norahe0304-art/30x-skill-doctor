<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>RED Carousel Preview · Skill Doctor</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font: 400 14px/1.5 "Geist", -apple-system, sans-serif;
      color: var(--color-foreground);
      background: var(--color-default);
    }
    .page-head {
      max-width: 1200px; margin: 0 auto;
      padding: 64px 60px 32px;
    }
    .eyebrow { font-size: 14px; color: var(--color-muted); letter-spacing: 1.5px; margin-bottom: 8px; }
    .h1 { font-size: 40px; font-weight: 500; letter-spacing: -1px; margin: 0 0 8px 0; }
    .h-sub { font-size: 18px; color: var(--color-muted); }

    .grid {
      max-width: 1200px; margin: 0 auto;
      padding: 32px 60px 80px;
      display: grid; grid-template-columns: 1fr; gap: 56px;
    }
    .slide-wrap {
      display: flex; flex-direction: column; gap: 16px;
    }
    .slide-meta {
      display: flex; align-items: baseline; justify-content: space-between;
    }
    .slide-meta .label {
      font-size: 14px; font-weight: 500; color: var(--color-muted);
      letter-spacing: 1.5px;
    }
    .slide-meta .name {
      font-size: 22px; font-weight: 500;
    }
    .slide-meta .open {
      font-size: 13px; color: var(--color-muted);
      text-decoration: none;
    }
    .slide-meta .open:hover { color: var(--color-foreground); }

    .frame-shell {
      position: relative;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: var(--shadow-overlay);
      background: var(--color-background);
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 1080 / 1350;
    }
    .frame-shell iframe {
      position: absolute; top: 0; left: 0;
      width: 1080px; height: 1350px;
      border: 0;
      transform-origin: top left;
    }

    /* Scale each iframe to fit container width.
       Container max width is 1080px (full size). At smaller viewport, transform
       does the math via CSS variable trick on the wrapper. */
    @media (max-width: 1140px) {
      .frame-shell iframe { transform: scale(0.7); }
      .frame-shell { aspect-ratio: 756 / 945; }
    }
  </style>
</head>
<body>
  <div class="page-head">
    <div class="eyebrow">REVIEW</div>
    <h1 class="h1">Skill Doctor · RED Carousel</h1>
    <p class="h-sub">5 slides, 1080 × 1350 (4:5). Zi UI · light theme · single accent.</p>
  </div>

  <div class="grid">
    <div class="slide-wrap">
      <div class="slide-meta">
        <div><span class="label">SLIDE 01</span> &nbsp; <span class="name">Cover</span></div>
        <a class="open" href="01-cover.html" target="_blank">Open ↗</a>
      </div>
      <div class="frame-shell"><iframe src="01-cover.html"></iframe></div>
    </div>

    <div class="slide-wrap">
      <div class="slide-meta">
        <div><span class="label">SLIDE 02</span> &nbsp; <span class="name">Problem</span></div>
        <a class="open" href="02-problem.html" target="_blank">Open ↗</a>
      </div>
      <div class="frame-shell"><iframe src="02-problem.html"></iframe></div>
    </div>

    <div class="slide-wrap">
      <div class="slide-meta">
        <div><span class="label">SLIDE 03</span> &nbsp; <span class="name">Solution</span></div>
        <a class="open" href="03-solution.html" target="_blank">Open ↗</a>
      </div>
      <div class="frame-shell"><iframe src="03-solution.html"></iframe></div>
    </div>

    <div class="slide-wrap">
      <div class="slide-meta">
        <div><span class="label">SLIDE 04</span> &nbsp; <span class="name">Demo (with GIF)</span></div>
        <a class="open" href="04-demo.html" target="_blank">Open ↗</a>
      </div>
      <div class="frame-shell"><iframe src="04-demo.html"></iframe></div>
    </div>

    <div class="slide-wrap">
      <div class="slide-meta">
        <div><span class="label">SLIDE 05</span> &nbsp; <span class="name">CTA</span></div>
        <a class="open" href="05-cta.html" target="_blank">Open ↗</a>
      </div>
      <div class="frame-shell"><iframe src="05-cta.html"></iframe></div>
    </div>
  </div>
</body>
</html>
