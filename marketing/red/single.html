<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Skill Doctor · 小红书单页 4:5</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font: 400 14px/1.5 "Geist", -apple-system, "PingFang SC", sans-serif;
      color: var(--color-foreground);
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: var(--color-default);
    }
    .canvas {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(165deg, #FFF7E8 0%, #FFE6C7 50%, #FFD0A0 100%);
      position: relative;
      overflow: hidden;
      padding: 72px 64px;
      box-sizing: border-box;
      box-shadow: var(--shadow-overlay);
      display: flex; flex-direction: column;
    }
    .blob {
      position: absolute;
      width: 480px; height: 480px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      pointer-events: none;
    }
    .blob-1 { top: -160px; right: -160px; background: #FFD64A; }
    .blob-2 { bottom: -200px; left: -200px; background: var(--color-accent-soft); }

    .top-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 36px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 22px;
      background: rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      font-size: 24px; font-weight: 500;
      color: var(--color-foreground);
      backdrop-filter: blur(8px);
    }
    .ver {
      font-size: 22px; font-weight: 500;
      color: var(--color-muted);
      letter-spacing: 0.5px;
    }

    .hero {
      display: flex; align-items: flex-end; gap: 32px;
      margin-bottom: 28px;
    }
    .number {
      font-size: 280px;
      font-weight: 500;
      line-height: 0.85;
      letter-spacing: -10px;
      background: linear-gradient(180deg, #1f1f23 30%, #d94132 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-text {
      font-size: 60px; font-weight: 500;
      line-height: 1.1; letter-spacing: -1px;
      padding-bottom: 24px;
    }
    .hero-text em {
      font-style: normal;
      background: linear-gradient(180deg, transparent 60%, #FFD64A 60%);
      padding: 0 6px;
    }

    .runtimes {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 36px;
    }
    .rt {
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      font-size: 24px; font-weight: 500;
      color: var(--color-foreground);
      box-shadow: var(--shadow-surface);
    }

    .divider {
      height: 1px;
      background: rgba(31, 31, 35, 0.12);
      margin: 0 0 28px 0;
    }

    .solution-tag {
      display: inline-block;
      padding: 8px 18px;
      background: var(--color-foreground);
      color: var(--color-background);
      border-radius: 999px;
      font-size: 22px; font-weight: 500;
      margin-bottom: 20px;
    }
    .solution-line {
      font-size: 56px; font-weight: 500;
      line-height: 1.15; letter-spacing: -1px;
      margin-bottom: 24px;
    }
    .solution-line em {
      font-style: normal;
      color: var(--color-foreground);
      border-bottom: 6px solid #FFD64A;
      padding-bottom: 2px;
    }

    .findings {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px;
      margin-bottom: 32px;
    }
    .finding {
      padding: 22px 22px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(6px);
    }
    .finding-num {
      font-size: 56px; font-weight: 500;
      line-height: 1; letter-spacing: -2px;
      margin-bottom: 4px;
    }
    .finding-num.dup { color: #b27c1f; }
    .finding-num.drift { color: #c2912a; }
    .finding-num.broken { color: #c2322a; }
    .finding-label {
      font-size: 22px; font-weight: 500;
      color: var(--color-muted);
    }

    .install-card {
      margin-top: auto;
      background: #1a1a1f;
      border-radius: 28px;
      padding: 32px 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);
      display: flex; align-items: center; gap: 24px;
    }
    .install-prompt { color: #7dd3a4; font-size: 32px; font-family: "Geist Mono", "SF Mono", monospace; }
    .install-cmd {
      color: #f4f4f7;
      font: 500 36px/1 "Geist Mono", "SF Mono", Consolas, monospace;
      flex: 1;
    }
    .install-cmd .pkg { color: #fbbf24; }

    .footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 28px;
      font-size: 22px;
    }
    .gh {
      font-weight: 500;
      color: var(--color-foreground);
      display: inline-flex; align-items: center; gap: 10px;
    }
    .gh svg { width: 26px; height: 26px; }
    .watermark {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 500;
      color: var(--color-muted);
      opacity: 0.65;
      letter-spacing: 0.5px;
    }
    .watermark-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--color-foreground);
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="top-row">
      <div class="badge">🩺 Skill Doctor</div>
      <div class="ver">v0.3 · OPEN SOURCE</div>
    </div>

    <div class="hero">
      <div class="number">453</div>
      <div class="hero-text">
        我的 AI Skill 库<br>
        已经<em>炸了</em> 😵‍💫
      </div>
    </div>

    <div class="runtimes">
      <span class="rt">Claude Code</span>
      <span class="rt">Codex</span>
      <span class="rt">Cursor</span>
      <span class="rt">OpenClaw</span>
      <span class="rt">+4 more</span>
    </div>

    <div class="divider"></div>

    <span class="solution-tag">✨ 一个命令</span>
    <div class="solution-line">
      看清 + 整理 整个 <em>skill 仓库</em>
    </div>

    <div class="findings">
      <div class="finding">
        <div class="finding-num dup">70</div>
        <div class="finding-label">🟠 组重复<br>可合并</div>
      </div>
      <div class="finding">
        <div class="finding-num drift">38</div>
        <div class="finding-label">🟡 组漂移<br>同名不同版</div>
      </div>
      <div class="finding">
        <div class="finding-num broken">25</div>
        <div class="finding-label">✗ 个断链<br>清掉省心</div>
      </div>
    </div>

    <div class="install-card">
      <span class="install-prompt">$</span>
      <span class="install-cmd">pip install <span class="pkg">skill-doctor</span></span>
    </div>

    <div class="footer">
      <span class="gh">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        github.com/norahe0304-art/30x-skill-doctor
      </span>
      <span class="watermark">
        <span class="watermark-dot"></span>
        @30x · 30x-skill-doctor
      </span>
    </div>
  </div>
</body>
</html>
