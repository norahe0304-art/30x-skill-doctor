[project]
name = "skill-doctor"
version = "0.5.0"
description = "Cross-runtime AI agent skill housekeeping: spot duplicates, drift, broken symlinks, junk, and stale skills across Claude Code, Codex, Cursor, OpenClaw, and more."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nora He", email = "norahe0304@gmail.com" }]
keywords = [
  "ai-agents",
  "claude-code",
  "codex",
  "skills",
  "agent-skills",
  "cli",
  "housekeeping",
  "deduplication",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "questionary>=2.0",
  "rapidfuzz>=3.9",
  "rich>=13.7",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/norahe0304-art/30x-skill-doctor"
Repository = "https://github.com/norahe0304-art/30x-skill-doctor"
Issues = "https://github.com/norahe0304-art/30x-skill-doctor/issues"

[project.scripts]
skill-doctor = "skill_doctor.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["legacy", ".venv", "dist"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_doctor"]
exclude = ["src/skill_doctor/legacy/**"]

[tool.hatch.build.targets.sdist]
include = [
  "src/skill_doctor",
  "tests",
  "README.md",
  "LICENSE",
  "AGENTS.md",
  "pyproject.toml",
  "uv.lock",
]
exclude = [
  "src/skill_doctor/legacy",
  "tests/legacy",
  "**/__pycache__",
  "**/*.pyc",
  ".skill-doctor",
  "research",
  "dist",
]
